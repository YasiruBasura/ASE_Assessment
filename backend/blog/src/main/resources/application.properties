spring.application.name=blog
# MySQL Connection
spring.datasource.url=jdbc:mysql://localhost:3306/blog_assessment
spring.datasource.username=root
spring.datasource.password=4425

# Hibernate settings (Updates the schema automatically based on your Java classes)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true


# ==========================================
# SECURITY CONFIGURATION
# ==========================================
# In a real production environment, the JWT_SECRET is injected via environment variables.
# For this assessment, if the environment variable is missing, it safely falls back
# to the local development string below so the app can run immediately.
jwt.secret=${JWT_SECRET:ThisIsMyLocalDevSecretDoNotUseInProd32Chars}
jwt.expiration=${JWT_EXPIRATION:86400000}