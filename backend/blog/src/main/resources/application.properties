spring.application.name=blog
# MySQL Connection
spring.datasource.url=jdbc:mysql://localhost:3306/blog_assessment
spring.datasource.username=root
spring.datasource.password=4425

# Hibernate settings (Updates the schema automatically based on your Java classes)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# JWT Secret Key (Must be at least 256 bits / 32 characters long)
jwt.secret=ThisIsAMySuperSecretKeyForBlogAssessmentDoNotShare
jwt.expiration=86400000 
# Expiration is 1 day in milliseconds (24 * 60 * 60 * 1000)